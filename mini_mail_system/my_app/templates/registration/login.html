{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود | Mini Mail System</title>
    <link rel="stylesheet" href="{% static 'my_app/style.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="card">
            <h1>ورود</h1>

            {% if form.errors %}
                <p class="error">نام کاربری یا رمز عبور اشتباه است.</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">ورود</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>

            <p class="switch-link">حساب نداری؟ <a href="{% url 'signup' %}">ثبت‌نام کن</a></p>
        </div>
    </div>
</body>
</html>
