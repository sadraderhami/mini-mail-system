{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ثبت‌نام | Mini Mail System</title>
    <link rel="stylesheet" href="{% static 'my_app/style.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="card">
            <h1>ثبت‌نام</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">ثبت‌نام</button>
            </form>

            <p class="switch-link">قبلاً ثبت‌نام کردی؟ <a href="{% url 'login' %}">وارد شو</a></p>
        </div>
    </div>
</body>
</html>
