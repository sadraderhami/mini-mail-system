{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>جستجوی کاربر | Mini Mail System</title>
    <link rel="stylesheet" href="{% static 'my_app/style.css' %}">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <span>خوش اومدی، <strong>{{ user.username }}</strong></span>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost">خروج</button>
            </form>
        </header>

        <main class="card">
            <h1>پیدا کردن کاربر</h1>

            <form method="get" class="compose-form">
                <input type="text" name="q" value="{{ query }}" placeholder="آیدی (نام کاربری) رو وارد کن...">
                <button type="submit" class="btn">جستجو</button>
            </form>

            {% if query %}
                <ul class="message-list">
                    {% for u in results %}
                        <li class="message-item">
                            <p>{{ u.username }}</p>
                            <a href="{% url 'chat' u.username %}" class="btn" style="width:auto; display:inline-block;">شروع چت</a>
                        </li>
                    {% empty %}
                        <li class="empty-state">کاربری با این آیدی پیدا نشد.</li>
                    {% endfor %}
                </ul>
            {% endif %}
        </main>
    </div>
</body>
</html>
