{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>پیام‌ها | Mini Mail System</title>
    <link rel="stylesheet" href="{% static 'my_app/style.css' %}">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <span>خوش اومدی، <strong>{{ user.username }}</strong></span>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost">خروج</button>
            </form>
        </header>

        <main class="card">
            <h1>پیام‌ها</h1>

            <form method="post" class="compose-form">
                {% csrf_token %}
                <textarea name="text" rows="3" placeholder="چیزی بنویس..."></textarea>
                <button type="submit" class="btn">ارسال</button>
            </form>

            <ul class="message-list">
                {% for message in messages %}
                    <li class="message-item">
                        <p>{{ message.text }}</p>
                        <time>{{ message.created_at }}</time>
                    </li>
                {% empty %}
                    <li class="empty-state">هنوز پیامی نیست.</li>
                {% endfor %}
            </ul>
        </main>
    </div>
</body>
</html>
