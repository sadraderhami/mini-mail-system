{% extends "base.html" %}
{% load i18n %}
{% block title %} {% translate "Sign up" %} {% endblock %}
{% block content %}
<h1>{% translate "Sign up" %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% translate "Sign up" %}</button>
</form>
<p>{% translate "Already have an account?" %} <a href="{% url 'login' %}">{% translate "Login" %}</a></p>
{% endblock %}
